<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Placeholder: Exterior (photo to come)">
<style>@media (max-width: 332px) { .ph-label { display: none; } }</style>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120d07"/><stop offset=".6" stop-color="#0E0A06"/><stop offset="1" stop-color="#070602"/></linearGradient>
  <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF9A2E" stop-opacity=".55"/><stop offset=".35" stop-color="#874E11" stop-opacity=".32"/><stop offset="1" stop-color="#4C2807" stop-opacity="0"/></radialGradient>
  <radialGradient id="soft" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B98442" stop-opacity=".35"/><stop offset="1" stop-color="#4C2807" stop-opacity="0"/></radialGradient>
  <radialGradient id="dot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F4D696" stop-opacity="1"/><stop offset=".25" stop-color="#FF9A2E" stop-opacity=".7"/><stop offset="1" stop-color="#FF9A2E" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D696"/><stop offset=".5" stop-color="#DDB06B"/><stop offset="1" stop-color="#874E11"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A2E" stop-opacity=".75"/><stop offset=".55" stop-color="#B98442" stop-opacity=".55"/><stop offset="1" stop-color="#874E11" stop-opacity=".35"/></linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a0c"/><stop offset="1" stop-color="#0d0905"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4D696" stop-opacity=".28"/><stop offset="1" stop-color="#FF9A2E" stop-opacity="0"/></linearGradient>
  <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4D696" stop-opacity=".9"/><stop offset="1" stop-color="#874E11" stop-opacity=".9"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070602" stop-opacity="0"/><stop offset="1" stop-color="#070602" stop-opacity=".92"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
